name: Veille Doléances

on:
  schedule:
    # Le passage horaire (8 h-21 h, heure de Paris) est lancé par cron-job.org via workflow_dispatch.
    # Ce cron GitHub n'est qu'un secours, à h:37 UTC de 6 h à 20 h pour couvrir été comme hiver :
    # le bot s'arrête aussitôt hors de 8 h-21 h à Paris ou si le passage de l'heure a déjà eu lieu.
    - cron: "37 6-20 * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Tâches à forcer hors créneau (ex. recap,wiki,agenda)"
        required: false
        default: ""

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22 minimum : @supabase/supabase-js a besoin du WebSocket natif de Node.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run veille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FORCER: ${{ github.event.inputs.forcer }}
